<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/utility.css">

    <title>Spotify</title>

</head>

<body>

    <div class="container flex bg-black">

        <div class="left">

            <div class="close">

                <img width="30" class="invert" src="img/close.svg" alt="">

            </div>

            <div class="home bg-grey rounded m-1 p-1">

                <div class="logo"><a href="index.html"><img width="110" class="invert" src="img/logo.svg" alt=""></a></div>

            </div>

            <div class="library bg-grey rounded m-1 p-1">

                <div class="heading">

                    <img class="invert" src="img/playlist.svg" alt="">

                    <h2>
                        Your Library
                    </h2>

                </div>


                <div class="songList">

                    <ul>

                    </ul>

                </div>

                <div class="footer">

                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>

                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>

                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a></div>

                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>

                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>

                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>

                </div>

            </div>


        </div>

        <div class="right bg-grey rounded">

                        <img width="40" class="invert hamburger" src="img/hamburger.svg" alt="">

            <div class="spotifyPlaylists">

                <h1>Spotify Playlists</h1>

                <div class="searchBox">

                    <img src="img/search.svg" alt="Search" class="searchIcon">

                    <input type="text" id="searchInput" placeholder="Search what you wanna listen to.." autocomplete="off">

                </div>

                <a href="https://github.com/Vinayak-Gamerzz/Spotify/releases" class="downloadApp">
                    Download App
                </a>

                <div class="cardContainer"> 
                    
                </div>

                <div class="playbar">

                    <div class="seekbar">

                        <div class="circle">


                        </div>

                    </div>

                    <div class="abovebar">

                        <div class="songinfo"></div>

                        <div class="songbuttons">

                                <button id="favouriteBtn" title="Add to favourites..">♡</button>

                                <img width="35" id="previous" src="img/prevsong.svg" alt="">

                                <img width="35" id="play" src="img/play.svg" alt="">

                                <img width="35" id="next" src="img/nextsong.svg" alt="">

                            <div class="volume">

                                <img width="25" src="img/volume.svg" alt="">

                            <div class="range">

                                <input type="range" name="volume" id="">

                            </div>

                        </div>

                        </div>

                        <div class="timevol">

                       
                        <div class="songtime">

                        </div>

                        

                    </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
    <script type="module" src="js/script.js"></script>
    <script src="js/cache.js"></script>
    
</body>

</html>
